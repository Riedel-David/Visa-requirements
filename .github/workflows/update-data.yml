name: Update Data

on:
  schedule:
    - cron: '17 4 * * 1'  # Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (bypass revision checks)'
        type: boolean
        default: false
      only:
        description: 'Only process these passports (comma-separated ISO codes, e.g., DE,US)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pipeline_exit_code: ${{ steps.run_pipeline.outputs.exit_code }}
      data_changed: ${{ steps.check_changes.outputs.data_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Run visa pipeline
        id: run_pipeline
        env:
          FORCE_FLAG: ${{ inputs.force }}
          ONLY_FLAG: ${{ inputs.only }}
        run: |
          CMD="python -m visa_pipeline run --data data --state state --out out"
          if [ "$FORCE_FLAG" = "true" ]; then
            CMD="$CMD --force"
          fi
          if [ -n "$ONLY_FLAG" ]; then
            CMD="$CMD --only $ONLY_FLAG"
          fi

          set +e
          $CMD
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pipeline-output
          path: out/
          retention-days: 90

      - name: Check for data changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain data state)" ]; then
            echo "data_changed=true" >> $GITHUB_OUTPUT
          else
            echo "data_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          DATESTAMP=$(date +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"

          # Create commit with first ~50 lines of changelog
          CHANGELOG_EXCERPT=$(head -n 50 out/changelog.md)
          git add data state
          git commit -m "Update visa data $DATESTAMP" -m "$CHANGELOG_EXCERPT"
          git push origin main

          # Create tag (with suffix if tag exists)
          TAG="data-$DATESTAMP"
          SUFFIX=1
          while git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; do
            SUFFIX=$((SUFFIX + 1))
            TAG="data-$DATESTAMP-$SUFFIX"
          done
          git tag "$TAG"
          git push origin "$TAG"

      - name: Check for pipeline issues
        id: check_issues
        if: always()
        run: |
          if [ ! -f out/summary.json ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_ISSUES=$(python -c "
          import json
          with open('out/summary.json') as f:
              data = json.load(f)
              has = bool(data.get('blocked') or data.get('failed') or data.get('unmapped_statuses'))
              print('true' if has else 'false')
          ")
          echo "has_issues=$HAS_ISSUES" >> $GITHUB_OUTPUT

      - name: Create or update issue
        if: steps.check_issues.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure label exists
          gh label create data-pipeline --color FF0000 --description "Data pipeline requires attention" --force

          # Check for existing open issue
          EXISTING_ISSUE=$(gh issue list --label data-pipeline --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            # Comment on existing issue
            gh issue comment "$EXISTING_ISSUE" --body-file out/report.md
          else
            # Create new issue
            gh issue create \
              --title "Visa data pipeline needs attention" \
              --label data-pipeline \
              --body-file out/report.md
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: data

      - name: Fail if pipeline failed
        if: steps.run_pipeline.outputs.exit_code != '0'
        run: |
          echo "Pipeline exited with code ${{ steps.run_pipeline.outputs.exit_code }}"
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: update
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
