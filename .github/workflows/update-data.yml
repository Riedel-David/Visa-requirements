name: Update Data

on:
  schedule:
    - cron: '17 4 * * 1'  # Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Reparse all pages and bypass the safety thresholds'
        type: boolean
        default: false
      only:
        description: 'Only process these passports (comma-separated ISO codes, e.g., DE,US)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit data and push the data-YYYY-MM-DD tag
      issues: write     # open/update the data-pipeline issue
      pages: read       # configure-pages reads the Pages site config
    outputs:
      pipeline_exit_code: ${{ steps.run_pipeline.outputs.exit_code }}
      data_changed: ${{ steps.check_changes.outputs.data_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Run visa pipeline
        id: run_pipeline
        env:
          FORCE_FLAG: ${{ inputs.force }}
          ONLY_FLAG: ${{ inputs.only }}
        run: |
          ARGS=(run --data data --state state --out out)
          if [ "$FORCE_FLAG" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -n "$ONLY_FLAG" ]; then
            ARGS+=(--only "$ONLY_FLAG")
          fi

          set +e
          python -m visa_pipeline "${ARGS[@]}"
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pipeline-output
          path: out/
          retention-days: 90

      - name: Check for data changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain data state)" ]; then
            echo "data_changed=true" >> $GITHUB_OUTPUT
          else
            echo "data_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        id: commit
        if: steps.check_changes.outputs.data_changed == 'true'
        run: |
          DATESTAMP=$(date +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"

          # Create commit with first ~50 lines of changelog
          CHANGELOG_EXCERPT=$(head -n 50 out/changelog.md)
          git add data state
          git commit -m "Update visa data $DATESTAMP" -m "$CHANGELOG_EXCERPT"
          git pull --rebase origin main
          git push origin main

          # Create tag (with suffix if tag exists)
          TAG="data-$DATESTAMP"
          SUFFIX=1
          while git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; do
            SUFFIX=$((SUFFIX + 1))
            TAG="data-$DATESTAMP-$SUFFIX"
          done
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.commit.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          python3 - <<'PY' > release-notes.md
          import json
          import os
          s = json.load(open("out/summary.json"))
          print(f"Visa requirements data refreshed from Wikipedia ({os.environ['TAG'].removeprefix('data-')}).\n")
          print(f"- Passports parsed: {s['pages_parsed']} (unchanged and skipped: {s['pages_skipped_unchanged']})")
          print(f"- Total rows: {s['rows']}")
          print(f"- Changes: {s['changes']}")
          if s.get("blocked"):
              print(f"- Blocked by safety thresholds (old data kept): {len(s['blocked'])}")
          if s.get("failed"):
              print(f"- Failed: {len(s['failed'])}")
          print()
          # GitHub release notes are limited to 125000 characters
          changelog = open("out/changelog.md").read()
          if len(changelog) > 100000:
              changelog = changelog[:100000] + "\n\n_Changelog truncated; see out/changelog.md in the workflow artifact._\n"
          print(changelog)
          print("\nData derived from Wikipedia, licensed CC BY-SA 4.0. See LICENSE-DATA.md.")
          PY
          gh release create "$TAG" \
            --title "Visa data ${TAG#data-}" \
            --notes-file release-notes.md \
            data/all.json data/passport-index-*.csv

      - name: Check for pipeline issues
        id: check_issues
        if: always()
        run: |
          if [ ! -f out/summary.json ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_ISSUES=$(python -c "
          import json
          with open('out/summary.json') as f:
              data = json.load(f)
              has = bool(data.get('blocked') or data.get('failed'))
              print('true' if has else 'false')
          ")
          echo "has_issues=$HAS_ISSUES" >> $GITHUB_OUTPUT

      - name: Create or update issue
        if: steps.check_issues.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure label exists
          gh label create data-pipeline --color FF0000 --description "Data pipeline requires attention" --force

          # Check for existing open issue
          EXISTING_ISSUE=$(gh issue list --label data-pipeline --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            # Comment on existing issue
            gh issue comment "$EXISTING_ISSUE" --body-file out/report.md
          else
            # Create new issue
            gh issue create \
              --title "Visa data pipeline needs attention" \
              --label data-pipeline \
              --body-file out/report.md
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: data

      - name: Fail if pipeline failed
        if: steps.run_pipeline.outputs.exit_code != '0'
        run: |
          echo "Pipeline exited with code ${{ steps.run_pipeline.outputs.exit_code }}"
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: update
    permissions:
      pages: write
      id-token: write
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
